<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 ToDo List App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://i.pinimg.com/736x/51/81/9c/51819c0566eb155d5f90f9d4967da4ee.jpg">
</head>
<body>

    <div class="wrapper">

        <div class="container">
            <h2>🗒️ To-Do</h2>
            <input type="text" id="addlist" placeholder="Enter your task...">
            <button id="addButton">Add Task</button>
            <div class="todo_list"></div>
        </div>

        <div class="container">
            <h2>🚧 In Progress</h2>
            <div class="progress_list"></div>
        </div>

        <div class="container">
            <h2>✅ Done</h2>
            <div class="done_list"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
